parts:
  prefixes:
    - id: 1
      word: in-
      definition: in, into; not
      example: inactive, incomplete, invisible

  roots:
    - id: 1
      word: al/ alter
      definition: other
      example: alter, alternate, alternative
    - id: 2
      word: tru
      definition: faithful
      example: true, truth, truly

  suffixes:
    - id: 1
      word: -able
      definition: able to be
      example: washable, readable, breakable
    - id: 2
      word: -ate/n-ate
      definition: to make, to act; one who, that which
      example: activate, educate, separate
    - id: 3
      word: -ation
      definition: an action or process
      example: alteration, celebration, preparation
    - id: 4
      word: n-ative
      definition: of, or relating to
      example: alternative, imaginative, informative
    - id: 5
      word: i-en
      definition: having the quality of
      example: alien, citizen, golden
    - id: 6
      word: ist-ic
      definition: like, related to
      example: altruistic, artistic, realistic
    - id: 7
      word: -ism
      definition: a state of being; a quality or act
      example: altruism, optimism, heroism

definitions:
  - id: 1
    word: inalienable
    definition: that may not be taken away or transferred
    example: Freedom of speech is considered an <em>inalienable</em> right.
  - id: 2
    word: alteration
    definition: action of changing or modifying
    example: The tailor made an <em>alteration</em> to the dress so that it would fit better.
  - id: 3
    word: altruism
    definition: selfless concern for the welfare of others
    example: Her decision to volunteer at the shelter was an act of <em>altruism</em>.
  - id: 4
    word: alternate
    definition: to do in turns
    example: The two students <em>alternate</em> taking care of the class pet.
  - id: 5
    word: alternative
    definition: a choice between two things or among many
    example: We chose biking as an <em>alternative</em> to driving.
  - id: 6
    word: alien
    definition: foreign
    example: The explorer found himself in an <em>alien</em> environment unlike anything he had seen before.
  - id: 7
    word: alienation
    definition: action of withdrawing or separating from a former attachment
    example: Moving away from his friends caused him to feel a sense of <em>alienation</em>.
  - id: 8
    word: alienate
    definition: to separate or make hostile
    example: His rude comments began to <em>alienate</em> him from his classmates.
  - id: 9
    word: altruistic
    definition: unselfish, generous
    example: Donating her prize money to charity was an <em>altruistic</em> act.
  - id: 10
    word: alter
    definition: to change, to modify
    example: We had to <em>alter</em> our plans because of the rain.
